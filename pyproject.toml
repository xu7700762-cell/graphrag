[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-eeg-agent"
version = "0.2.0"
description = "VRMS dual-model monitoring and evidence-based cloud EEG agents"
requires-python = ">=3.9"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11", "PyYAML>=6", "fastapi>=0.115,<0.116", "uvicorn>=0.34,<0.35", "openai>=1.109,<2", "pydantic>=2.11,<3", "onnxruntime>=1.19,<2", "psutil>=5.9"]

[project.scripts]
eeg-agent = "eeg_agent.cli:main"

[project.optional-dependencies]
online = ["torch>=2.7,<3", "scikit-learn==1.6.1", "joblib==1.5.3", "einops>=0.8,<1"]
train = ["torch>=2.7", "onnx>=1.17", "scikit-learn>=1.3", "matplotlib>=3.7"]
test = ["pytest>=7", "httpx>=0.27"]

[tool.setuptools.package-data]
eeg_agent = ["web/*", "brain_knowledge/*/*.md", "online/licenses/*"]

[tool.setuptools.packages.find]
include = ["eeg_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
